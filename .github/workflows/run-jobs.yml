name: Validate GardEgypt task files

on:
  push:
    paths:
      - "jobs/*.json"
      - "jobs/**/*.json"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect changed task files
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" | grep -E '^jobs/.+\.json$' > /tmp/jobs.txt || true
          cat /tmp/jobs.txt
      - name: Validate task manifests
        run: |
          while IFS= read -r job; do
            [ -n "$job" ] || continue
            python worker.py --input "$job"
          done < /tmp/jobs.txt
